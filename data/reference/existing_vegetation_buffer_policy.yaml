# Отступ новой посадки от УЖЕ СУЩЕСТВУЮЩЕГО насаждения с заключением «сохранить»
# (перечетная ведомость, см. docs/DATA_STRUCTURE.md §4).
#
# СТАТУС: НЕ норма, а практическое допущение проекта — явно согласовано с пользователем
# 2026-09-15 ("на твоё усмотрение"). Единой обязательной цифры «на все случаи» не существует —
# расстояние в реальном садоводстве зависит от силы роста дерева (сорт/подвой), типа культуры
# (плодовые/хвойные/декоративные) и условий участка. Источники ориентиров:
#   - общая практика питомниководства (розничные и отраслевые рекомендации, не НПА);
#   - СП 53.13330.2019 «Планировка и застройка территории ведательческих некоммерческих
#     объединений граждан» — даёт отступы от стволов до ГРАНИЦЫ УЧАСТКА для дачных/садовых
#     товариществ, НЕ для городского общественного пространства (наш случай) — используется
#     здесь по аналогии, не как прямое требование к нашему объекту.
# Поэтому: verified=False везде, где используется эта политика (см. buffer_engine.py,
# ConstraintFeature.explicit_distance_m используется НЕ отсюда — здесь используется fallback-
# путь unverified_fallback_m, чтобы это было явно видно в отчёте).

status: assumption_not_verified_norm
rationale: >
  Пользователь подтвердил (2026-09-15): единой цифры нет, зависит от силы роста/культуры/
  условий участка; решение по конкретному числу — на усмотрение разработчика с опорой на
  общую практику и СП 53.13330.2019 (для дачных/садовых участков, применяется по аналогии).

vigor_tiers:
  # Расстояние между двумя деревьями одной категории силы роста (то есть и минимальный
  # отступ новой посадки от существующего дерева этой категории), метры.
  vigorous:
    label_ru: "Сильнорослые (яблоня/груша на семенном подвое, дуб, тополь и т.п.)"
    between_trees_m: [4, 6]
    default_m: 6  # консервативный выбор — верхняя граница диапазона
  medium:
    label_ru: "Среднерослые (вишня, слива, карликовые яблони/груши)"
    between_trees_m: [3, 4]
    default_m: 4
  dwarf_columnar:
    label_ru: "Карликовые и колоновидные формы"
    between_trees_m: [2, 3]
    default_m: 3
  shrub:
    label_ru: "Кустарник (по аналогии с СП 53.13330.2019 — отступ от кустарника)"
    default_m: 1

# Если категория силы роста существующего дерева неизвестна (типичный случай — точка на
# топоплане без вида, см. docs/DATA_STRUCTURE.md §9), применяется САМАЯ КОНСЕРВАТИВНАЯ
# категория (vigorous), чтобы не занизить отступ по недостатку данных.
unknown_vigor_default_tier: vigorous
