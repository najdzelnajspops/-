# Словарь соответствия имён слоёв DXF -> boundary_type для Constraint Engine.
#
# Источник конвенции: реальный DWG/DXF геооснова объекта «Олимпийская деревня»
# (см. docs/DATA_STRUCTURE.md §9) — открыт и разобран лично, конвертирован через
# ODA File Converter, слои прочитаны через ezdxf. Реальные имена слоёв имеют вид
# "<источник>|<категория>" (например "output[1-18]_3_ДЖКХ-25_03117up|Водопровод"),
# где часть после ПОСЛЕДНЕГО "|" — небольшой, предсказуемый набор русскоязычных
# названий. Матчинг ведётся именно по этой части, без учёта префикса-источника.
#
# СТАТУС: покрывает только слои, реально увиденные на ОДНОМ разобранном объекте.
# Это не исчерпывающий список для всех 20 объектов — по мере разбора новых
# объектов сюда нужно будет добавлять новые варианты написания (см.
# docs/DATA_ALGORITHM.md, "Алгоритм добавления новой территории" — статус
# manual_layer_mapping_required для нераспознанных слоёв, а не тихий пропуск).

# Слои коммуникаций -> boundary_type из data/reference/offset_norms.yaml
communication_layers:
  "Водопровод": water_supply
  "Промводопровод": water_supply
  "Газопровод": gas_pipeline
  "Канализация напорная": sewage
  "Канализация самотёчная": sewage
  "Общий коллектор": sewage
  "Дренаж": drainage
  "Сопутствующий дренаж": drainage
  "Водосток": drainage  # ливневая канализация — реально самый частый слой на живом объекте (21198 сущностей)
  "Теплосеть": heating_main
  "Трубопроводы": heating_main
  "Кабель электрический": power_cable
  "Кабель защиты": power_cable
  "Кабели": power_cable  # смешанный/неуточнённый тип кабеля — консервативно как силовой (тот же отступ, что и связь)
  "Кабель связи": communication_cable

# Найдено 2026-09-17 на «3-я Парковая» (файлы 3_ДЖКХ-25_02294.dwg /
# 3ДЖКХпр-25_02294.dwg — предположительно up/tp-эквивалент этого объекта без
# явного суффикса в имени файла): та же вторая конвенция именования слоёв, что
# и "ДВ_ГП_П_Граница работ" ниже — целиком слитное "Категория_Подкатегория" без
# "|"-разделителя источника (у этого объекта его просто нет), а не найденная
# ранее часть после "|". Полные строки взяты буквально из реального DXF (без
# домысливания), включая расхождение регистра между двумя файлами одного
# бандла ("Сущ_сети_" vs "Сущ_Сети_") — оба варианта добавлены явно, а не через
# общий механизм "игнорировать регистр", которого в классификаторе нет.
# "Проект_сети_"/"Проектные_Сети_" — ЗАПЛАНИРОВАННЫЕ (не существующие) сети:
# у новой постройки будущая труба физически будет там же, где спроектирована,
# поэтому отступ нужен так же, как и от существующей — не отбрасывается.
  "Сущ_сети_Водопровод": water_supply
  "Сущ_Сети_Водопровод": water_supply
  "Сущ_сети_Газопровод": gas_pipeline
  "Сущ_Сети_Газопровод": gas_pipeline
  "Сущ_сети_Канализация самотёчная": sewage
  "Сущ_Сети_Канализация самотёчная": sewage
  "Сущ_сети_Дренаж": drainage
  "Сущ_Сети_Дренаж": drainage
  "Сущ_сети_Водосток": drainage
  "Сущ_Сети_Водосток": drainage
  "Сущ_сети_Теплосеть": heating_main
  "Сущ_Сети_Теплосеть": heating_main
  "Сущ_сети_Кабель электрический": power_cable
  "Сущ_Сети_Кабель электрический": power_cable
  "Сущ_сети_Кабель защиты": power_cable
  "Сущ_Сети_Кабель защиты": power_cable
  "Сущ_сети_Кабели": power_cable
  "Сущ_Сети_Кабели": power_cable
  "Сущ_сети_Кабель связи": communication_cable
  "Сущ_Сети_Кабель связи": communication_cable
  "Проект_сети_Водосток проектный": drainage
  "Проектные_Сети_Водосток проектный": drainage
  "Проект_сети_Дренаж проектный": drainage
  "Проектные_Сети_Дренаж проектный": drainage
  "Проект_сети_Кабель электрический проектный": power_cable
  "Проектные_Сети_Кабель электрический проектный": power_cable
  "Проект_сети_Кабели проектные": power_cable
  "Проектные_Сети_Кабели проектные": power_cable
  "Проектные_Сети_Кабель защиты проектный": power_cable  # только во втором файле бандла — первый не разделяет "Кабели"/"Кабель защиты" на проектной стороне
  "Проектные_Сети_Кабель связи проектный": communication_cable  # аналогично, только во втором файле

# Топоплан -> boundary_type (743-ПП, не про коммуникации)
topo_layers:
  # "Красные линии" — НЕ норма 743-ПП (это самостоятельное градостроительное
  # ограничение, юридическая граница между территорией участка и улично-
  # дорожной сетью), но по прямому решению пользователя (2026-09-17: «красные
  # линии - зона запрета размещения насаждений») — вся нарисованная площадь
  # запрещена для посадки. Отступ (0 м, а не норма 743-ПП) проставляется
  # отдельной политикой pipeline/constraints/red_lines_policy.py — так же,
  # как existing_vegetation.py делает для сохраняемых насаждений, — а не через
  # data/reference/offset_norms.yaml, чтобы не выдать это решение за цитату
  # 743-ПП (см. pipeline/otk/citation_integrity.py, проверка 6.3).
  "Красные линии": red_lines_no_planting
  "Опоры контакной сети": lighting_or_tram_mast  # опечатка "контакной" — так в реальном слое, оставлено как есть
  "Опоры контактной сети": lighting_or_tram_mast
  "Отдельно стоящее дерево": existing_tree_preserve
  "Полоса деревьев": existing_tree_preserve
  "Здания": building_wall
  "Бортовой камень": roadway_edge  # найдено 2026-09-16 на реальном объекте («Нижние Поля», комбинированный гео.dwg) — бордюрный камень типично обозначает границу проезжей части, уже покрыт verified-нормой 743-ПП (2,0 м дерево/1,0 м куст); слоя "Тротуары"/"Дорожки" отдельно в реальных данных не найдено вообще
  # Тот же слитный "Топо_..." вариант написания, что и коммуникации выше
  # (найдено на «3-я Парковая» 2026-09-17, одинаково в обоих файлах бандла):
  "Топо_Опоры контакной сети": lighting_or_tram_mast
  "Топо_Отдельно стоящее дерево": existing_tree_preserve
  "Топо_Полоса деревьев": existing_tree_preserve
  "Топо_Здания": building_wall
  "Топо_Бортовой камень": roadway_edge

# ЛЭП — отдельная норма (160-ПП, не 743-ПП), класс напряжения по имени слоя
# НЕ определяется — только сам факт "это ЛЭП". Voltage_kv должен приходить
# из атрибутов объекта/явного ввода оператора, а не угадываться по слою.
lep_layers:
  "ЛЭП": power_line_overhead_unknown_voltage
  "Топо_ЛЭП": power_line_overhead_unknown_voltage  # найдено на «3-я Парковая», см. комментарий у "Топо_..." выше

# Слои границы участка (для определения site_boundary, не ConstraintFeature)
# Порядок — приоритет: первый найденный closed-контур на любом из этих слоёв.
site_boundary_layers:
  - "Граница площадки"
  - "Граница участка"
  - "Граница заказа"
  - "ДВ_ГП_П_Граница работ"  # найдено 2026-09-15 на 3 объектах датасета (2-я прядильная, 3-я Парковая, Камчатская) — судя по одинаковому написанию, шаблон одного проектного бюро, не опечатка/случайность
  - "Топо_Граница площадки"  # найдено 2026-09-17 на «3-я Парковая» (3_ДЖКХ-25_02294.dwg/3ДЖКХпр-25_02294.dwg) — тот же слитный "Топо_..." вариант, что и коммуникации выше

# Служебные слои чертежа — заведомо НЕ реальные объекты местности, игнорируются
# полностью (рамки листа, координатные кресты, подписи).
ignored_layers:
  - "Рамки"
  - "Подписи рамок"
  - "Координатные кресты"
  - "Пояснительные подписи"
  - "Номер дома"
  - "Топографические объекты"  # общая категория подписей, не геометрия ограничения
  # Тот же слитный "Кресты_..." вариант написания (найдено на «3-я Парковая»,
  # 2026-09-17) — рамки листа/координатные кресты/подписи, буквально те же
  # служебные объекты, что и бары выше, просто под другим префиксом категории.
  - "Кресты_Рамки"
  - "Кресты_Подписи рамок"
  - "Кресты_Координатные кресты"

# Слои, которые реально встречены, но осознанно НЕ классифицированы —
# не потому что забыли, а потому что классификация была бы гаданием:
#   - "Подземные коммуникации" — общий сборный слой без указания вида сети;
#     нельзя выбрать конкретный boundary_type не зная, что именно там лежит.
#   - "Ограды" — не описано отдельной нормой в 743-ПП, отступ не определён.
#   - "Столбы" — неясно, столб чего (освещение? линия связи? другое?) — без
#     дополнительного признака не сопоставляется с "мачта осветительной сети".
#   - "Горизонтали", "Геодезические пункты" — топография/геодезия, не ограничение
#     для посадки; вторые нужны для геопривязки (см. docs/OPEN_QUESTIONS.md).
# Такие слои попадают в статус "unclassified" при разборе — фиксируются в отчёте
# онбординга, не пропускаются молча.
