# Охранные зоны объектов электросетевого хозяйства (ЛЭП, кабельные линии, подстанции).
# Источник: Постановление Правительства РФ от 24.02.2009 № 160, п. 21-22 (охранные зоны, таблица),
# со сноской на подпункт "б" (подземные кабельные линии).
# Статус: verified — сверено с первоисточником (docs/tz_source/normative_acts/Постановление...160...pdf).
#
# ВАЖНО: это охранная зона объекта электросетевого хозяйства (зона ограничения деятельности,
# включая посадку/вырубку насаждений без согласования с сетевой организацией) — регулятивно
# ОТДЕЛЬНАЯ вещь от арборикультурного отступа дерева/кустарника из 743-ПП (offset_norms.yaml).
# Обе нормы применяются одновременно: если охранная зона шире отступа из 743-ПП — действует она.
# Ширина ниже одинакова для дерева и кустарника — это зона ограничения деятельности вообще,
# а не дифференцированный отступ по виду насаждения.

source:
  act_code: PP_RF_160
  act_name: "Постановление Правительства РФ от 24.02.2009 № 160, п. 21-22"
  status: verified

overhead_lines:
  # Ширина в каждую сторону от крайних проводов при неотклонённом положении, метры.
  - voltage_kv_max: 1
    width_m: 2.0
    note: "Для линий с самонесущими/изолированными проводами по стенам зданий — определяется отдельно нормативами для таких линий"
  - voltage_kv_min: 1
    voltage_kv_max: 20
    width_m: 10.0
    note: "5 м для линий с самонесущими/изолированными проводами в границах населённых пунктов"
  - voltage_kv_max: 35
    width_m: 15.0
  - voltage_kv_max: 110
    width_m: 20.0
  - voltage_kv_max: 220
    width_m: 25.0
    note: "150 и 220 кВ"
  - voltage_kv_max: 500
    width_m: 30.0
    note: "300, 500, ±400 кВ"
  - voltage_kv_max: 750
    width_m: 40.0
    note: "750, ±750 кВ"
  - voltage_kv_max: 1150
    width_m: 55.0

underground_cable_lines:
  default_width_m: 1.0
  note: "От крайних кабелей в каждую сторону"
  city_sidewalk_up_to_1kv:
    toward_buildings_m: 0.6
    toward_roadway_m: 1.0
    note: "При прохождении кабельных линий напряжением до 1 кВ в городах под тротуарами"

substations:
  note: "Ширина зоны вокруг подстанции = ширина для высшего класса напряжения подстанции (подпункт «а», overhead_lines выше)"
