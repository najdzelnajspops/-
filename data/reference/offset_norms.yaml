#   санитарным правилам/нормам, которых нет в текущем комплекте документов;
# - точная таблица из Приказа Госстроя РФ № 153 от 15.12.1999 (упомянута в СП 82.13330.2016 как источник [5]) —
#   реквизиты подтверждены, сам текст не получен.
