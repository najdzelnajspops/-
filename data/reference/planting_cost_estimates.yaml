# Оценочная стоимость посадочного материала по категориям (руб./шт.).
#
# ИСТОЧНИК И СТАТУС: НЕ норма, НЕ официальный прайс-лист от организаторов
# (по словам пользователя, у организаторов только устное упоминание, что
# стоимость «плавает» по питомнику — отдельного документа/прайс-листа они не
# предоставили, см. docs/OPEN_QUESTIONS.md, 2026-09-16). Числа ниже — оценка
# по РЕАЛЬНЫМ прайс-листам нескольких российских питомников декоративных
# растений (retail/мелкий опт, не крупный муниципальный контракт — по факту
# муниципальные закупки обычно дешевле розницы за счёт объёма, но точных
# оптовых цифр для этого нет, поэтому диапазон взят с запасом в обе стороны).
#
# ГРАНУЛЯРНОСТЬ: по категориям (жизненная форма × хвойное/лиственное × размер
# посадочного материала), а не по каждому из 329 видов каталога ДПиООС —
# решение пользователя 2026-09-16 (реальные прайс-листы питомников тоже
# устроены по категориям/размерным классам, не по уникальной цене на каждый
# вид — это соответствует практике отрасли).
#
# ОБЯЗАТЕЛЬНОЕ УСЛОВИЕ (прямое требование пользователя): значения в этом файле
# ДОЛЖНЫ быть редактируемыми человеком — правьте default_rub (и при желании
# min_rub/max_rub) напрямую в этом файле, без изменения кода. Код всегда читает
# текущее значение отсюда, ничего не хардкодит.
#
# Источники (веб-поиск 2026-09-16, актуальность на дату поиска, не гарантирует
# сохранение цен во времени — типичная оговорка для рыночных цен):
#   - https://www.medra.ru/catalog/hvojnye/index.html (хвойные деревья)
#   - https://rasteniya24.ru/allproduct/ и https://rasteniya24.ru/derevya-krupnomery/ (деревья/крупномеры)
#   - https://www.zpitomniki.ru/catalog/listvennye/lipa/ (лиственные крупномеры)
#   - https://xn--80aam0cf1a8b.xn--p1ai/product-category/dekorativnye-kustarniki/ (кустарники, питомник "Царь Сад")
# Цены на этих сайтах преимущественно за ИМПОРТНЫЕ декоративные сорта
# (Польша/Германия) — как правило дороже, чем базовый (не сортовой) посадочный
# материал основного ассортимента ДПиООС; там, где это заметно завышало бы
# оценку, диапазон сознательно смещён к нижней части найденных цифр.

override_note: >
  Любое значение ниже можно и нужно скорректировать вручную, если у вас есть
  более точные данные (реальный прайс-лист питомника-подрядчика, коммерческое
  предложение и т.п.) — это явно ожидаемый штатный сценарий, не обход системы.

categories:
  conifer_tree_standard:
    label_ru: "Хвойное дерево, стандартный размер (высота ок. 1,5-3 м)"
    min_rub: 2000
    max_rub: 15000
    default_rub: 6000
    note: "Ель/сосна/пихта, контейнер C5-C10, без учёта специальных импортных сортов"

  conifer_tree_large:
    label_ru: "Хвойное дерево, крупномер (высота от ок. 3 м, соответствует 515-ПП «крупномер»)"
    min_rub: 15000
    max_rub: 50000
    default_rub: 25000
    note: "Верхняя граница может быть значительно выше для редких сортов/очень крупных экземпляров — не включено в default"

  deciduous_tree_standard:
    label_ru: "Лиственное дерево, стандартный саженец (высота ок. 2-3 м)"
    min_rub: 500
    max_rub: 3000
    default_rub: 1500
    note: "Базовые виды (липа, берёза, клён остролистный и т.п.), не сортовые формы"

  deciduous_tree_large:
    label_ru: "Лиственное дерево, крупномер (обхват ствола ок. 10-18 см)"
    min_rub: 8000
    max_rub: 30000
    default_rub: 15000
    note: "Специальные декоративные сорта (напр. импортные краснолистные формы) могут стоить в разы дороже — не включено в default"

  conifer_shrub:
    label_ru: "Хвойный кустарник (можжевельник, туя и т.п.), стандартный размер"
    min_rub: 500
    max_rub: 3000
    default_rub: 1200
    note: "Контейнер C2-C3"

  deciduous_shrub_standard:
    label_ru: "Лиственный кустарник, стандартный размер (высота ок. 30-100 см)"
    min_rub: 300
    max_rub: 1500
    default_rub: 700
    note: "Живая изгородь/бордюрные виды (бирючина, спирея, пузыреплодник и т.п.)"

  deciduous_shrub_large:
    label_ru: "Лиственный кустарник, крупный экземпляр (высота от ок. 100 см)"
    min_rub: 1500
    max_rub: 7000
    default_rub: 3000
    note: "Сирень, крупные ивы кустовой формы и т.п."

  liana:
    label_ru: "Лиана"
    min_rub: 500
    max_rub: 3000
    default_rub: 1000
    note: "[требует верификации] — прямых цен на лианы в проверенных источниках не найдено, оценка по аналогии с лиственным кустарником стандартного размера"

# Целевой бюджет на озеленение (не норма — устное упоминание организаторов,
# см. docs/OPEN_QUESTIONS.md 2026-09-16): по Москве в среднем 10-25 млн руб/га;
# в районах реновации может доходить до 50 млн руб/га (не используется по
# умолчанию — ориентируемся на 10-25 по прямому указанию пользователя).
target_budget_per_hectare:
  min_rub: 10000000
  max_rub: 25000000
  source: "Устное упоминание организаторов хакатона (не документ), см. docs/OPEN_QUESTIONS.md"
