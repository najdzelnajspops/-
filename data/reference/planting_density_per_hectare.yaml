# Максимальное количество деревьев и кустарников на 1 га озеленённой территории.
#
# Источник: Постановление Правительства Москвы от 06.08.2002 № 623-ПП
# (МГСН 1.02-02 «Нормы и правила проектирования комплексного благоустройства
# на территории города Москвы»), Приложение В, Таблица В.1.
# Статус: verified — сверено с первоисточником
# (docs/tz_source/normative_acts/Постановление Правительства Москвы от 06.08.2002 N 623-ПП (р.docx).
#
# НАЙДЕНО И ВНЕСЕНО 2026-09-16: до этого Placement Generator вообще не
# использовал норму ПЛОТНОСТИ (шт/га) — густота кустарника считалась чисто
# геометрически (шаг сетки из нормы «групповая посадка», предназначенной для
# расстояния ВНУТРИ одной группы, не для сетки по всей территории), что на
# реальном объекте (49 га) дало 292932 куста вместо разумных ~20-24 тысяч.
# См. docs/SESSION_LOG.md, docs/OPEN_QUESTIONS.md.

source:
  act_code: PP_623
  act_name: "Постановление Правительства Москвы от 06.08.2002 № 623-ПП (МГСН 1.02-02), Приложение В, Таблица В.1"
  status: verified

# Значения — [минимум, максимум] штук на 1 га. Используется максимум как
# жёсткий верхний предел общего числа посадок на участок (не сетка!) —
# см. pipeline/placement/density.py.
#
# Соответствие territory_category (см. pipeline/catalog/dpioos_species_catalog.py)
# строкам Таблицы В.1 — где соответствие не дословное, это явно отмечено.
density_per_ha:
  dvorovye:
    trees: [100, 120]
    shrubs: [400, 480]
    source_row: "Участки жилой застройки"
    mapping_confidence: exact

  doshkolnye:
    trees: [160, 200]
    shrubs: [640, 800]
    source_row: "Участки детских садов и яслей"
    mapping_confidence: exact

  obscheobr:
    trees: [140, 180]
    shrubs: [560, 720]
    source_row: "Участки школ"
    mapping_confidence: exact
    note: "obscheobr в проекте включает и колледжи (см. dpioos_species_assortment.json) — таблица даёт отдельную строку только для школ, для колледжей отдельной нормы нет, используется та же."

  zdravoohr:
    trees: [180, 250]
    shrubs: [720, 1000]
    source_row: "Больницы и лечебные учреждения"
    mapping_confidence: exact

  magistrali:
    trees: [150, 180]
    shrubs: [600, 720]
    source_row: "Улицы, набережные"
    mapping_confidence: exact

  parki:
    trees: [120, 170]
    shrubs: [800, 1000]
    source_row: "Парки общегородские и районные"
    mapping_confidence: exact

  proizvodstvennye:
    trees: [150, 180]
    shrubs: [600, 720]
    source_row: "Участки промышленных предприятий"
    mapping_confidence: exact
    note: "В таблице отмечено <*> «в зависимости от профиля предприятия» — используется как есть, без корректировки по профилю (данных о профиле предприятия нет)."

  ploschadi:
    trees: [100, 130]
    shrubs: [1000, 1300]
    source_row: "Скверы (приближение)"
    mapping_confidence: approximate
    note: >
      НЕ точное совпадение — в Таблице В.1 нет отдельной строки для «Площади,
      пространства общественно-делового и торгово-развлекательного назначения
      (запечатанные/полузапечатанные поверхности)» (описание категории ploschadi
      в dpioos_species_assortment.json). Взята строка «Скверы» как ближайший
      по смыслу общественный озеленённый объект, но ploschadi по определению
      преимущественно ЗАПЕЧАТАННАЯ поверхность — реальная плотность может быть
      существенно ниже. Использовать с осторожностью, см. docs/OPEN_QUESTIONS.md.

# Дополнительные строки Таблицы В.1, не соответствующие ни одной из 8 категорий
# проекта напрямую (оставлены для справки, не используются в коде):
reference_only_rows:
  bульвары: {trees: [200, 300], shrubs: [1200, 1300]}
  территории_специального_назначения_санитарно_защитные_зоны: "в зависимости от процента озеленения зоны — не числовая норма"
